# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are secrets: Render
# asks for them on first setup and they never live in the repository.
services:
  - type: web
    name: text-to-learn-api
    runtime: node
    plan: free
    # Singapore is the closest Render region to India; pick the one nearest your Atlas cluster.
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    # Deploy main only after the GitHub Actions CI checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      # The Vercel URL(s) of the client, comma-separated, e.g. https://text-to-learn.vercel.app
      - key: CLIENT_ORIGINS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH0_ISSUER
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
